<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | CarePlus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .sub {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            transition: 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            display: none;
        }
        .error {
            background: #ffe0e0;
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }
        .success {
            background: #e0ffe0;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📅 Book an Appointment</h2>
        <div class="sub">Fill patient details & choose doctor</div>
        <form id="bookingForm" action="insertAppointment" method="post">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="patientName" required placeholder="e.g., John Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="9876543210">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" name="address" placeholder="City, Street">
            </div>
            <div class="form-group">
                <label>Select Doctor</label>
                <select name="doctorId" required>
                    <option value="">-- Choose --</option>
                    <option value="1">Dr. Rajesh Kumar (Cardiologist)</option>
                    <option value="2">Dr. Priya Sharma (Dermatologist)</option>
                    <option value="3">Dr. Amit Patel (Orthopedic)</option>
                    <option value="4">Dr. Neha Gupta (Pediatrician)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Appointment Date</label>
                <input type="date" name="appointmentDate" required>
            </div>
            <div class="form-group">
                <label>Appointment Time</label>
                <input type="time" name="appointmentTime" required>
            </div>
            <button type="submit">✅ Confirm Booking</button>
        </form>
        <div id="msg" class="message"></div>
        <div class="back-link">
            <a href="index.html">← Back to Dashboard</a>
        </div>
    </div>
    <script>
        // Show success/error message from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const msgDiv = document.getElementById('msg');
        if (urlParams.get('msg') === 'success') {
            msgDiv.innerHTML = 'Appointment booked successfully!';
            msgDiv.classList.add('success');
            msgDiv.style.display = 'block';
            setTimeout(() => { msgDiv.style.display = 'none'; }, 4000);
        } else if (urlParams.get('error') === 'failed') {
            msgDiv.innerHTML = 'Booking failed. Please try again.';
            msgDiv.classList.add('error');
            msgDiv.style.display = 'block';
        }
    </script>
</body>
</html>
